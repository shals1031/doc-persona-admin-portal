services:

  redis:
    image: redis:7-alpine
    container_name: doc_persona_redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - doc_persona_network

  fastapi_app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: doc_persona_admin_app
    ports:
      - "8000:8000"
    environment:
      DATABASE_HOST: host.docker.internal
      DATABASE_PORT: 5433
      DATABASE_USER: admin_user_doc
      DATABASE_PASSWORD: admin_user_doc
      DATABASE_NAME: doc_persona
      DATABASE_SCHEMA: admin_portal_ai
      REDIS_URL: redis://redis:6379/0
      JWT_SECRET: admin-portal-jwt-secret-change-in-production
      JWT_ALGORITHM: HS256
      ENVIRONMENT: development
    depends_on:
      redis:
        condition: service_healthy
    volumes:
      - .:/app
    networks:
      - doc_persona_network
    command: uvicorn main:app --host 0.0.0.0 --port 8000 --reload

  celery_worker:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: doc_persona_celery_worker
    environment:
      DATABASE_HOST: host.docker.internal
      DATABASE_PORT: 5433
      DATABASE_USER: admin_user_doc
      DATABASE_PASSWORD: admin_user_doc
      DATABASE_NAME: doc_persona
      DATABASE_SCHEMA: admin_portal_ai
      REDIS_URL: redis://redis:6379/0
      JWT_SECRET: admin-portal-jwt-secret-change-in-production
      JWT_ALGORITHM: HS256
      ENVIRONMENT: development
      PORT: 8080
    depends_on:
      redis:
        condition: service_healthy
    volumes:
      - .:/app
    networks:
      - doc_persona_network
    command: python workers/health_check_wrapper.py celery -A workers.celery_app worker --loglevel=info -Q default,ai-processing,analytics-refresh

  celery_beat:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: doc_persona_celery_beat
    environment:
      DATABASE_HOST: host.docker.internal
      DATABASE_PORT: 5433
      DATABASE_USER: admin_user_doc
      DATABASE_PASSWORD: admin_user_doc
      DATABASE_NAME: doc_persona
      DATABASE_SCHEMA: admin_portal_ai
      REDIS_URL: redis://redis:6379/0
      JWT_SECRET: admin-portal-jwt-secret-change-in-production
      JWT_ALGORITHM: HS256
      ENVIRONMENT: development
      PORT: 8081
    depends_on:
      redis:
        condition: service_healthy
    volumes:
      - .:/app
    networks:
      - doc_persona_network
    command: python workers/health_check_wrapper.py celery -A workers.celery_app beat --loglevel=info

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local

networks:
  doc_persona_network:
    driver: bridge
