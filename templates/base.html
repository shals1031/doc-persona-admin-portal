<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>{% block title %}Admin Portal{% endblock %}</title>
  <link
    href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
    rel="stylesheet"
  />
  <style>
    body { background-color: #f8f9fa; }
    .navbar-brand { font-weight: 700; letter-spacing: 0.03em; }
    .summary-card { border-left: 4px solid; }
    .summary-card.draft   { border-color: #6c757d; }
    .summary-card.submitted { border-color: #0d6efd; }
    .summary-card.approved  { border-color: #198754; }
    .summary-card.rejected  { border-color: #dc3545; }
  </style>
  {% block head %}{% endblock %}
</head>
<body>
  <nav class="navbar navbar-expand-lg navbar-dark bg-dark mb-4">
    <div class="container-fluid">
      <a class="navbar-brand" href="/dashboard">Doc Persona — Admin</a>
      <div class="ms-auto d-flex align-items-center gap-3">
        <span class="text-white-50 small">
          {% if ctx %}{{ ctx.role }} | {{ ctx.user_id }}{% endif %}
        </span>
      </div>
    </div>
  </nav>

  <main class="container-fluid px-4">
    {% block content %}{% endblock %}
  </main>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  {% block scripts %}{% endblock %}
</body>
</html>
