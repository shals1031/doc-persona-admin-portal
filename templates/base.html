<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Admin Portal{% endblock %}</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css" rel="stylesheet">
    <style>
        body {
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            background-color: #f8f9fa;
        }
        #sidebar {
            min-width: 250px;
            max-width: 250px;
            min-height: 100vh;
            transition: all 0.3s;
            background-color: #212529;
            color: #fff;
            display: flex;
            flex-direction: column;
        }
        #sidebar .sidebar-header {
            padding: 20px;
            background: #1a1d20;
        }
        #sidebar ul.components {
            padding: 20px 0;
            flex-grow: 1;
        }
        #sidebar ul li a {
            padding: 10px 20px;
            display: block;
            color: #adb5bd;
            text-decoration: none;
        }
        #sidebar ul li a:hover {
            color: #fff;
            background: #343a40;
        }
        #sidebar ul li.active > a {
            color: #fff;
            background: #0d6efd;
        }
        #content {
            width: 100%;
            padding: 20px;
            overflow-y: auto;
        }
        .wrapper {
            display: flex;
            width: 100%;
            align-items: stretch;
            height: 100vh;
        }
        .user-profile {
            padding: 15px 20px;
            border-top: 1px solid #343a40;
            background-color: #1a1d20;
        }
        .summary-card { border-left: 4px solid; }
        .summary-card.draft   { border-color: #6c757d; }
        .summary-card.submitted { border-color: #0d6efd; }
        .summary-card.approved  { border-color: #198754; }
        .summary-card.rejected  { border-color: #dc3545; }
    </style>
    {% block head %}{% endblock %}
</head>
<body>
    <div class="wrapper">
        <!-- Sidebar -->
        {% if ctx %}
        <nav id="sidebar">
            <div class="sidebar-header">
                <h5 class="mb-0">Doc Persona</h5>
                <small class="text-muted">Admin Portal</small>
            </div>

            <ul class="list-unstyled components">
                <li class="{% if request.url.path == '/dashboard' %}active{% endif %}">
                    <a href="/dashboard"><i class="fas fa-tachometer-alt me-2"></i> Dashboard</a>
                </li>
                <!-- Future menu items will be added here -->
            </ul>

            <div class="user-profile">
                <div class="d-flex align-items-center">
                    <div class="flex-grow-1 overflow-hidden">
                        <div class="small fw-bold text-truncate" title="{{ ctx.full_name or 'User' }}">
                            {{ ctx.full_name or 'User' }}
                        </div>
                        <div class="text-muted text-truncate" style="font-size: 0.75rem;">{{ ctx.role }}</div>
                    </div>
                    <a href="/logout" class="btn btn-outline-light btn-sm ms-2" title="Logout">
                        <i class="fas fa-sign-out-alt"></i>
                    </a>
                </div>
            </div>
        </nav>
        {% endif %}

        <!-- Page Content -->
        <div id="content">
            {% if not ctx %}
            <nav class="navbar navbar-expand-lg navbar-dark bg-dark mb-4">
                <div class="container-fluid">
                    <a class="navbar-brand" href="/">Doc Persona — Admin</a>
                    <div class="ms-auto">
                        <a href="/login" class="btn btn-outline-light btn-sm">Login</a>
                    </div>
                </div>
            </nav>
            {% endif %}

            <main class="container-fluid">
                {% block content %}{% endblock %}
            </main>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    {% block scripts %}{% endblock %}
</body>
</html>
